name: Marketing checks
on:
  pull_request:
    paths:
      - 'marketing/**'
      - '.github/workflows/marketing-*.yml'
      - 'site/lib.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r marketing/requirements.txt
      - run: python -m unittest discover -s marketing/tests -v
