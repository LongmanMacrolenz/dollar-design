name: Fasteners daily marketing

on:
  schedule:
    # 07:00 KST: prepare tomorrow's video; YouTube publishes at 20:00 KST.
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview only, or publish with configured YouTube and AI speech'
        type: choice
        options: [preview, publish]
        default: preview
      day:
        description: 'Optional future publication date in Korea (YYYY-MM-DD)'
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: fasteners-youtube-owner-channel
  cancel-in-progress: false

jobs:
  marketing:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.MARKETING_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YOUTUBE_CLIENT_ID: ${{ vars.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      PUBLISH_DAY: ${{ inputs.day }}
      MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: marketing/requirements.txt
      - name: Install renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r marketing/requirements.txt
      - name: Test publishing logic without external calls
        run: python -m unittest discover -s marketing/tests -v
      - name: Cache pinned local Korean voice model
        if: env.MODE == 'publish'
        uses: actions/cache@v4
        with:
          path: out/models
          key: fasteners-korean-voice-f015d1d15a52ed00-v1
      - name: Install verified Korean voice model (no speech API)
        if: env.MODE == 'publish'
        run: python -m marketing setup-model
      - name: Restore encrypted resumable state and pending media
        if: env.MODE == 'publish'
        uses: actions/cache/restore@v4
        with:
          path: |
            out/marketing/state
            out/marketing/pending
          key: fasteners-owner-${{ vars.YOUTUBE_CHANNEL_ID }}-${{ github.run_id }}-${{ github.run_attempt }}-done
          restore-keys: |
            fasteners-owner-${{ vars.YOUTUBE_CHANNEL_ID }}-
      - name: Create captioned layout preview (no voice API, no upload)
        if: env.MODE == 'preview'
        run: |
          args=()
          if [ -n "$PUBLISH_DAY" ]; then args+=(--day "$PUBLISH_DAY"); fi
          python -m marketing preview --out out/marketing-preview "${args[@]}"
      - name: Verify YouTube channel and local Korean voice model
        if: env.MODE == 'publish'
        run: python -m marketing doctor
      - name: Prepare tomorrow's media and encrypted upload session
        if: env.MODE == 'publish'
        id: prepare
        run: |
          args=()
          if [ -n "$PUBLISH_DAY" ]; then args+=(--day "$PUBLISH_DAY"); fi
          python -m marketing prepare --root out/marketing "${args[@]}"
      # Save successfully before transferring the first byte. A cancelled run
      # resumes this same server session rather than creating a duplicate video.
      - name: Persist checkpoint before media transfer
        if: env.MODE == 'publish' && steps.prepare.outputs.skip == 'false'
        uses: actions/cache/save@v4
        with:
          path: |
            out/marketing/state
            out/marketing/pending
          key: fasteners-owner-${{ vars.YOUTUBE_CHANNEL_ID }}-${{ github.run_id }}-${{ github.run_attempt }}-prepared
      - name: Confirm checkpoint persistence before upload
        if: env.MODE == 'publish' && steps.prepare.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_KEY: fasteners-owner-${{ vars.YOUTUBE_CHANNEL_ID }}-${{ github.run_id }}-${{ github.run_attempt }}-prepared
          CHECKPOINT_REPO: ${{ github.repository }}
        run: python -m marketing verify-checkpoint --repo "$CHECKPOINT_REPO" --key "$CHECKPOINT_KEY"
      - name: Resume upload, verify scheduled publication and set thumbnail
        if: env.MODE == 'publish' && steps.prepare.outputs.skip == 'false'
        run: python -m marketing upload --root out/marketing
      - name: Persist final or recoverable state
        if: always() && env.MODE == 'publish' && steps.prepare.outputs.skip == 'false'
        uses: actions/cache/save@v4
        with:
          path: |
            out/marketing/state
            out/marketing/pending
          key: fasteners-owner-${{ vars.YOUTUBE_CHANNEL_ID }}-${{ github.run_id }}-${{ github.run_attempt }}-done
      - name: Keep reviewable marketing assets (never OAuth or session files)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fasteners-marketing-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            out/marketing-preview/video.mp4
            out/marketing-preview/thumbnail.png
            out/marketing-preview/captions.srt
            out/marketing-preview/narration.txt
            out/marketing-preview/episode.json
            out/marketing/published/**/video.mp4
            out/marketing/published/**/thumbnail.png
            out/marketing/published/**/captions.srt
            out/marketing/published/**/narration.txt
            out/marketing/report.json
