<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const E = {
  inOut: x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2,
  out: x => 1 - Math.pow(1 - x, 3),
  in: x => x * x * x,
  back: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const shakeXY = (t, amp) => [amp * (Math.sin(t * 61.3) * .6 + Math.sin(t * 23.1 + 1.3) * .4), amp * (Math.sin(t * 53.7 + 2.1) * .6 + Math.sin(t * 19.9) * .4)];
// 장면 불투명도: a~b 구간, 앞뒤 페이드
function show(el, t, a, b, fin = 0, fout = 0) {
  let o = 0;
  if (t >= a && t < b) o = Math.min(fin ? prog(t, a, a + fin) : 1, fout ? 1 - prog(t, b - fout, b) : 1);
  el.style.opacity = o;
  return o > 0;
}
const NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }

// 한 번만 만드는 요소들
for (let i = 0; i < 18; i++) {
  const a = i / 18 * Math.PI * 2;
  svgEl('line', {x1: 960 + Math.cos(a) * 95, y1: 560 + Math.sin(a) * 95, x2: 960 + Math.cos(a + .35) * 395, y2: 560 + Math.sin(a + .35) * 395}, $('blades'));
}
{ const r = rng(7), bk = $('bokeh');
  for (let i = 0; i < 9; i++) { const d = document.createElement('div'); const s = 120 + r() * 220;
    d.className = 'glow'; Object.assign(d.style, {left: r() * 1800 + 'px', top: r() * 520 + 'px', width: s + 'px', height: s + 'px',
      background: `radial-gradient(circle, rgba(255,${170 + r() * 50 | 0},90,${.25 + r() * .25}), transparent 70%)`, filter: 'blur(6px)'});
    d.dataset.vx = (r() - .5) * 20; bk.appendChild(d); } }
{ const r = rng(3); for (let i = 0; i < 90; i++) svgEl('circle', {cx: r() * 1920, cy: r() * 700, r: r() * 1.8 + .4, opacity: r() * .7 + .2}, $('stars')); }
const KEY = [];
for (let row = 0; row < 4; row++) for (let col = 0; col < 4; col++)
  KEY.push(svgEl('rect', {x: 600 + col * 92, y: 735 + row * 58, width: 76, height: 44, rx: 10, fill: '#3b3e46'}, $('keys')));
const PANEL_TEXT = ['핵 프로그램 제거', '우라늄 농축 순도', '지하 시설의 깊이'];
['p1', 'p2', 'p3'].forEach((id, i) => {
  $(id).innerHTML = `<svg viewBox="0 0 640 1080" style="position:absolute;inset:0">
      <path d="M 0 0 L 260 0 L 60 1080 L 0 1080 Z" fill="#fff" opacity=".04"/><path d="M 420 0 L 640 0 L 640 1080 L 560 1080 Z" fill="#fff" opacity=".03"/>
      <circle cx="320" cy="400" r="95" fill="#0b0d14"/><path d="M 90 1080 C 110 650, 530 650, 550 1080 Z" fill="#0b0d14"/>
      <path d="M 250 560 L 320 640 L 390 560 Z" fill="#e9ecf2" opacity=".85"/></svg>
    <div class="flare"></div><div class="streak"></div>
    <div class="ticker"><div class="lab">속보</div><div class="txt">${PANEL_TEXT[i]}</div></div>`;
});
const threads = [...document.querySelectorAll('.thread')];
threads.forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.len = L; });

const CAPS = [
  [0.35, 2.4, '', '폭격기는 이란으로 날아갔는데,'],
  [2.75, 4.95, '', '원두값은 서울에서 올랐습니다.'],
  [5.5, 8.9, '', '2026년 2월 28일 새벽.'],
  [9.3, 12.9, '', '세계가 들은 이유는 하나였습니다.'],
  [19.7, 22.9, '아버지', '원두값 또 오르겠네…'],
  [24.4, 25.9, '서진', '전쟁은 이란에서 났는데,'],
  [28.3, 29.9, '', '이 이야기는 그 질문에서 시작합니다.'],
  [30.0, 31.1, '', '왜 하필 지금인가.'],
];
const grainCtx = $('grain').getContext('2d');
const grainImg = grainCtx.createImageData(480, 270);

window.setTime = function (T) {
  const frame = Math.round(T * 24);
  let camScale = 1, sx = 0, sy = 0, camFilter = '';

  // S1 엔진 (0–2.5)
  if (show($('s1'), T, 0, 2.5)) {
    const ign = prog(T, .15, .35), flash = Math.exp(-Math.pow((T - .3) / .08, 2));
    const glow = Math.min(1, .15 + ign * .6 + prog(T, .35, 2.3) * .35 + flash * .5);
    $('s1core').setAttribute('opacity', glow);
    $('s1glow').style.opacity = glow;
    $('blades').setAttribute('transform', `rotate(${T * T * 40} 960 560)`);
    $('s1zoom').setAttribute('transform', `scale(${1 + T * .035})`);
    $('heatTurb').setAttribute('seed', frame % 97);
    [sx, sy] = shakeXY(T, 3 + flash * 14);
  }
  // S2 원두 (2.5–5.0)
  if (show($('s2'), T, 2.5, 5.0)) {
    const t = T - 2.5, land = .85;
    let y;
    if (t < land) y = lerp(-120, 610, E.in(prog(t, 0, land)) * .6 + prog(t, 0, land) * .4);
    else if (t < 1.12) { const b = prog(t, land, 1.12); y = 610 - Math.sin(b * Math.PI) * 55; }
    else if (t < 1.3) { const b = prog(t, 1.12, 1.3); y = 610 - Math.sin(b * Math.PI) * 14; }
    else y = 610;
    $('bean').setAttribute('transform', `translate(960 ${y}) rotate(${-25 + Math.min(t, 1.3) * 22})`);
    const up = prog(t, 1.25, 2.2);
    const price = Math.round(lerp(12800, 15400, E.out(up)) / 100) * 100;
    $('lcd').textContent = price.toLocaleString('en-US');
    $('lcdUp').setAttribute('opacity', up > 0 ? 1 : 0);
    const sp = $('sparks'); sp.innerHTML = '';
    if (t > land && t < land + .35) { const k = prog(t, land, land + .35), r = rng(11);
      for (let i = 0; i < 12; i++) { const a = -Math.PI * r(), d = 40 + k * 120 * (.5 + r());
        svgEl('circle', {cx: 960 + Math.cos(a) * d, cy: 650 + Math.sin(a) * d * .5, r: 3 * (1 - k) + .5, fill: '#ffd9a0', opacity: 1 - k}, sp); } }
    [...$('bokeh').children].forEach(d => d.style.transform = `translateX(${d.dataset.vx * t}px)`);
    $('s2zoom').setAttribute('transform', `scale(${1 + t * .04})`);
  }
  // S3 활주로 (5.0–9.0)
  if (show($('s3'), T, 5.0, 9.0)) {
    const t = T - 5;
    const lights = $('edgeLights'), cl = $('centerline'); lights.innerHTML = ''; cl.innerHTML = '';
    for (let i = 0; i < 16; i++) {
      const s = ((i / 16 + t * .45) % 1), p = Math.pow(s, 2.2), y = 600 + 480 * p, half = 30 + 600 * p;
      [-1, 1].forEach(side => svgEl('ellipse', {cx: 960 + side * half, cy: y, rx: 2 + 16 * p, ry: 1 + 5 * p, fill: '#ffcf8a', opacity: .3 + .7 * s}, lights));
      if (i % 2 === 0) { const s2 = ((i / 16 + t * .45 + .03) % 1), p2 = Math.pow(s2, 2.2);
        svgEl('rect', {x: 960 - (1 + 10 * p), y: y, width: 2 + 20 * p, height: Math.max(2, 480 * (p2 - p)), fill: '#c9c4b8', opacity: .5 * s}, cl); }
    }
    const k = E.inOut(prog(t, .2, 4));
    const scale = lerp(2.5, .95, k), cx = 960, cy = lerp(800, 440, k);
    $('b2run').setAttribute('transform', `translate(${cx - 200 * scale} ${cy - 70 * scale}) scale(${scale})`);
    $('b2fire').setAttribute('opacity', .7 + .3 * Math.sin(T * 40));
    $('dawn').style.opacity = .6 + .4 * prog(t, 0, 4);
    const lo = $('lower');
    const a = E.out(prog(t, .4, 1.0)), b = prog(t, 3.5, 3.9);
    lo.style.opacity = a * (1 - b); lo.style.transform = `translateX(${(1 - a) * -60}px)`;
    [sx, sy] = shakeXY(T, 2 + 5 * (1 - k));
  } else { $('lower').style.opacity = 0; }
  // S4 머리 위 (9.0–13.0)
  if (show($('s4'), T, 9.0, 13.0)) {
    const t = T - 9, k = prog(t, .2, 3.6), scale = 4.6;
    const y = lerp(1150, -780, E.inOut(k));
    $('b2over').setAttribute('transform', `translate(${960 - 200 * scale} ${y}) scale(${scale})`);
    const near = Math.exp(-Math.pow((t - 1.9) / .7, 2));
    $('b2over').style.filter = `blur(${near * 2}px) drop-shadow(0 0 ${6 + near * 10}px rgba(255,160,60,.55))`;
    const du = $('dust'); du.innerHTML = ''; const r = rng(21);
    for (let i = 0; i < 60; i++) { const a = r() * Math.PI * 2, sp = 200 + r() * 900, d = ((t * sp + r() * 900) % 900);
      svgEl('circle', {cx: 960 + Math.cos(a) * d * 1.3, cy: 640 + Math.sin(a) * d * .7, r: .8 + d / 400, opacity: near * .8 * (d / 900)}, du); }
    [sx, sy] = shakeXY(T, 3 + near * 26);
    camScale = 1 + near * .03;
  }
  // S5 뉴스 (13.0–17.0) → S6 TV로 축소 (17.0–19.0)
  const newsOn = show($('news'), T, 13.0, 19.0);
  show($('shop'), T, 16.9, 28.0);
  if (newsOn) {
    const t = T - 13;
    [['p1', 0], ['p2', .8], ['p3', 1.6]].forEach(([id, at]) => {
      const p = prog(t, at, at + .25), el = $(id);
      el.style.opacity = p; el.style.transform = `scale(${lerp(1.25, 1, E.out(p))})`;
      const dim = prog(t, 2.35, 2.6); el.style.filter = `brightness(${(1 + Math.exp(-Math.pow((t - at - .05) / .06, 2)) * 1.5) * (1 - dim * .6)})`;
      el.querySelector('.txt').style.transform = `translateX(${(1 - E.out(prog(t, at + .1, at + .5))) * 300}px)`;
    });
    const n = prog(t, 2.6, 2.8), nOut = prog(t, 3.8, 4.0);
    $('nuke').style.opacity = n * (1 - nOut);
    $('nuke').style.transform = `scale(${lerp(2.4, 1, E.out(n))})`;
    const hits = [0, .8, 1.6, 2.6].map(h => Math.exp(-Math.pow((t - h - .08) / .1, 2)));
    [sx, sy] = shakeXY(T, 4 + Math.max(...hits) * 22);
    const pb = E.inOut(prog(T, 17.0, 18.6));
    $('news').style.transform = `translate(${390 * pb}px, ${-90 * pb}px) scale(${lerp(1, .34, pb)})`;
    $('tvbezel').style.opacity = prog(T, 17.2, 17.8);
  }
  // S7 계산기 (19.0–23.0)
  if (show($('s7'), T, 19.0, 23.0)) {
    const t = T - 19, taps = [.35, .7, 1.05, 1.5, 1.9, 2.3, 2.75];
    const keyIdx = [5, 2, 9, 14, 6, 1, 15];
    let fingerKey = keyIdx[0], down = 0, count = 0;
    taps.forEach((tp, i) => { if (t >= tp - .18) fingerKey = keyIdx[i]; const d = Math.exp(-Math.pow((t - tp) / .06, 2)); if (d > down) down = d; if (t >= tp) count = i + 1; });
    KEY.forEach((k, i) => k.setAttribute('fill', i === fingerKey && down > .3 ? '#6a6e78' : '#3b3e46'));
    const kx = +KEY[fingerKey].getAttribute('x') + 38, ky = +KEY[fingerKey].getAttribute('y') + 18;
    $('finger').setAttribute('transform', `translate(${kx} ${ky - 20 + down * 18})`);
    const vals = ['0', '1', '12', '128', '1,280', '12,800', '×1.2', '15,360'];
    $('calc').textContent = vals[count];
    const g = .5 + .5 * Math.sin(T * 3); $('glassL').setAttribute('opacity', .05 + .06 * g); $('glassR').setAttribute('opacity', .05 + .06 * g);
    camScale = 1.02 + t * .01;
  }
  // S8 서진 (23.0–28.0) + S9 정지 (28.0–31.2)
  const s8on = show($('s8'), T, 23.0, 31.3, 0, .3);
  if (s8on) {
    const t = Math.min(T, 27.99) - 23;
    const lift = E.inOut(prog(t, .4, 1.3));
    $('head').setAttribute('transform', `translate(${lerp(-60, 0, lift)} ${lerp(190, 0, lift)}) rotate(${lerp(-38, 6 * prog(t, 1.3, 2.2), lift)})`);
    $('eye').setAttribute('opacity', prog(t, 1.3, 1.6));
    $('phoneGlow').setAttribute('opacity', .35 + .25 * Math.sin(t * 2));
    camScale = 1 + t * .012;
    if (T >= 28) { const f = prog(T, 28, 28.4); camFilter = `grayscale(${f}) contrast(${1 + .15 * f}) brightness(${1 - .15 * f})`;
      camScale = 1 + 4.99 * .012 + E.out(prog(T, 28, 31)) * .05; }
  }
  // 큰 질문 글자 (25.9–28.0)
  const words = [...document.querySelectorAll('#question .w')];
  words.forEach((w, i) => { const p = prog(T, 25.9 + i * .22, 26.1 + i * .22), out = T >= 28 ? 1 : 0;
    w.style.opacity = p * (1 - out); w.style.transform = `translateY(${(1 - E.back(p)) * 40}px) scale(${lerp(1.3, 1, E.out(p))})`; });
  // S9 실과 로고 (31.2–33.0)
  if (show($('s9'), T, 31.1, 99, .25)) {
    const k = E.inOut(prog(T, 31.2, 32.0));
    threads.forEach(p => p.style.strokeDashoffset = p.dataset.len * (1 - k));
    const kn = prog(T, 31.9, 32.1); $('knotC').setAttribute('opacity', kn); $('knotC').setAttribute('r', 90 + 40 * Math.exp(-Math.pow((T - 32.05) / .1, 2)));
    const lg = E.out(prog(T, 32.0, 32.6)); $('logo').style.opacity = lg; $('logo').style.transform = `translateY(${-120 + (1 - lg) * 30}px) scale(${lerp(1.08, 1, lg)})`;
    if (T > 31.95 && T < 32.3) [sx, sy] = shakeXY(T, 10 * (1 - prog(T, 31.95, 32.3)));
  }

  $('cam').style.transform = `translate(${sx}px, ${sy}px) scale(${camScale})`;
  $('cam').style.filter = camFilter;

  // 자막
  const cap = $('cap'); let on = null;
  for (const c of CAPS) if (T >= c[0] && T < c[1]) on = c;
  if (on) { cap.innerHTML = (on[2] ? `<span class="who">${on[2]}</span>` : '') + on[3];
    cap.style.opacity = Math.min(prog(T, on[0], on[0] + .25), 1 - prog(T, on[1] - .2, on[1])); }
  else cap.style.opacity = 0;

  // 필름 그레인
  const r = rng(frame * 7919 + 1), d = grainImg.data;
  for (let i = 0; i < d.length; i += 4) { const v = r() * 255 | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  grainCtx.putImageData(grainImg, 0, 0);
};
window.DURATION = 33;
window.setTime(0);
